name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `npm ci` also builds: the package's prepare script compiles to dist/.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The examples must run exactly as the README says, with no API key.
      - run: node examples/quickstart.mjs
      - run: node dist/cli.js examples/freight-invoice.pdf --specs examples/specs --format csv
